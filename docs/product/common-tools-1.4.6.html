<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>知拍 · 常用工具逐页结构说明</title>
    <style>
      :root {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: #203954;
        background: #f3f6fa;
        --blue: #003cff;
        --muted: #71839b;
        --line: #e5ebf2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      a,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: #244ee0;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #69a7ff;
        outline-offset: 3px;
      }
      .doc-header {
        padding: 24px 32px;
        background: white;
        border-bottom: 1px solid var(--line);
      }
      .doc-eyebrow {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .doc-header h1 {
        font-size: 22px;
        margin: 8px 0 12px;
      }
      .doc-header p {
        font-size: 13px;
        color: #62758e;
        margin: 0;
        line-height: 1.8;
      }
      .doc-layout {
        max-width: 1500px;
        margin: auto;
        display: grid;
        grid-template-columns: 220px minmax(340px, 440px) minmax(300px, 1fr);
        gap: 28px;
        padding: 24px;
      }
      .doc-nav {
        max-height: calc(100vh - 190px);
        overflow: auto;
        position: sticky;
        top: 20px;
        align-self: start;
      }
      .doc-nav a {
        display: block;
        color: #586e87;
        text-decoration: none;
        font-size: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        margin: 2px 0;
      }
      .doc-nav a[aria-current="page"] {
        background: #e4edff;
        color: var(--blue);
        font-weight: 600;
      }
      .doc-nav strong {
        font-size: 12px;
        margin-right: 7px;
        font-variant-numeric: tabular-nums;
      }
      .doc-stage {
        min-width: 0;
      }
      .doc-pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .doc-pager button {
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 36px;
        padding: 0 14px;
        color: #415a77;
      }
      .doc-pager button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .doc-panel {
        background: white;
        border-radius: 18px;
        padding: 24px;
        align-self: start;
        line-height: 1.8;
      }
      .doc-panel h2 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      .doc-panel ol {
        padding-left: 21px;
        margin: 0;
      }
      .doc-panel li {
        font-size: 13px;
        margin-bottom: 14px;
      }
      .doc-tag {
        display: inline-block;
        padding: 3px 8px;
        background: #eef3fb;
        font-size: 11px;
        border-radius: 5px;
        color: #58708e;
        margin-bottom: 12px;
      }
      .doc-callout {
        font-size: 12px;
        padding: 14px 0 0;
        color: var(--muted);
        border-top: 1px solid var(--line);
        margin-top: 16px;
      }
      .doc-status {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .doc-status button {
        border: 1px solid #dee7f3;
        background: #fff;
        padding: 6px 11px;
        border-radius: 7px;
        color: #436184;
        font-size: 12px;
        min-height: 34px;
      }
      .doc-status button.active {
        color: var(--blue);
        background: #edf3ff;
        border-color: #bdd0ff;
      }
      .doc-mobile-select {
        display: none;
      }
      .wireframe-wrap {
        width: 100%;
        max-width: 402px;
        aspect-ratio: 402/874;
        position: relative;
        isolation: isolate;
        background: #f1f5fc;
        border: 1px solid #dbe3ef;
        border-radius: 30px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 26px #293c6010;
      }
      .wf-statusbar {
        height: 62px;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        padding: 20px 24px 0;
        font-size: 12px;
        font-weight: 600;
      }
      .wf-nav {
        height: 52px;
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        gap: 8px;
        align-items: center;
        padding: 0 12px;
        flex-shrink: 0;
      }
      .wf-nav strong {
        text-align: center;
        font-size: 17px;
      }
      .wf-nav button {
        width: 44px;
        height: 44px;
        border: 0;
        background: #fff;
        color: #203858;
        padding: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .wf-nav button svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      .wf-stepper {
        display: flex;
        position: relative;
        justify-content: space-around;
        padding: 12px 20px 16px;
        flex-shrink: 0;
      }
      .wf-step {
        position: relative;
        text-align: center;
        flex: 1;
        font-size: 11px;
        color: #8998ac;
        z-index: 1;
      }
      .wf-step::before {
        content: "";
        position: absolute;
        width: calc(100% - 30px);
        height: 1px;
        background: #dbe3ee;
        top: 12px;
        left: calc(-50% + 15px);
        z-index: -1;
      }
      .wf-step:first-child::before {
        display: none;
      }
      .wf-step i {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 24px;
        height: 24px;
        margin: 0 auto 6px;
        border: 1px solid #d6dfed;
        border-radius: 50%;
        background: #f1f5fc;
        font-style: normal;
        font-size: 11px;
      }
      .wf-step.current {
        color: var(--blue);
        font-weight: 600;
      }
      .wf-step.current i {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .wf-step.done i {
        border-color: var(--blue);
        color: var(--blue);
      }
      .wf-body {
        overflow: auto;
        flex: 1;
        padding: 16px 20px;
        min-height: 0;
      }
      .wf-body h3 {
        font-size: 16px;
        margin: 8px 0;
      }
      .wf-body p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        margin: 8px 0;
      }
      .wf-center {
        text-align: center;
      }
      .wf-empty {
        padding: 38px 0 20px;
        text-align: center;
      }
      .wf-bear {
        width: 136px;
        height: 136px;
        object-fit: contain;
      }
      .wf-photo {
        display: block;
        height: 250px;
        max-width: 100%;
        width: auto;
        object-fit: contain;
        margin: 0 auto;
      }
      .wf-photo-box {
        background: #f0f2f5;
        aspect-ratio: 5/7;
        width: 180px;
        max-width: 85%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wf-photo-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .wf-spec {
        font-size: 11px;
        color: #788ba4;
        text-align: center;
        margin: 12px 0 0;
      }
      .wf-text-button {
        background: none;
        border: 0;
        color: var(--blue);
        min-height: 44px;
        padding: 10px 12px;
        font-size: 13px;
      }
      .wf-change {
        display: block;
        margin: 0 auto;
      }
      .wf-footer {
        padding: 12px 16px 24px;
        background: white;
        flex-shrink: 0;
      }
      .wf-actions {
        display: flex;
        gap: 12px;
      }
      .wf-button {
        border: 0;
        border-radius: 14px;
        min-height: 48px;
        background: var(--blue);
        color: white;
        font-size: 14px;
        padding: 10px 14px;
        flex: 1;
      }
      .wf-button.secondary {
        background: #eef3ff;
        color: #3f5c80;
        flex: 0 0 96px;
      }
      .wf-button:disabled {
        background: #dce4f0;
        color: #91a2ba;
        cursor: default;
      }
      .wf-homebar {
        position: absolute;
        bottom: 7px;
        left: 34%;
        width: 32%;
        height: 4px;
        background: #273449;
        border-radius: 4px;
        pointer-events: none;
      }
      .wf-block {
        background: white;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .wf-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        font-size: 13px;
      }
      .wf-row small {
        font-size: 11px;
        color: #8493a7;
      }
      .wf-row strong {
        font-size: 14px;
      }
      .wf-price {
        font-size: 20px !important;
        color: var(--blue);
      }
      .wf-choice {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .wf-choice span {
        padding: 9px 12px;
        background: white;
        border: 1px solid #e2e9f2;
        border-radius: 9px;
        font-size: 12px;
      }
      .wf-choice span.selected {
        border-color: #acc2ff;
        color: var(--blue);
        background: #edf3ff;
      }
      .wf-swatches {
        display: flex;
        gap: 16px;
        overflow: auto;
        padding: 12px 0;
      }
      .wf-swatches span {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        flex-shrink: 0;
        border: 3px solid white;
        box-shadow: 0 0 0 1px #dce4ee;
      }
      .wf-fields label {
        font-size: 12px;
        display: block;
        color: #5c7390;
        margin: 16px 0 6px;
      }
      .wf-input {
        background: #f5f7fa;
        padding: 12px;
        border: 1px solid #e3e9f1;
        border-radius: 10px;
        font-size: 13px;
        min-height: 44px;
        color: #506782;
      }
      .wf-input-row {
        display: flex;
        gap: 8px;
      }
      .wf-input-row .wf-input {
        flex: 1;
      }
      .wf-notice {
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff1e9;
        color: #9e5a2b;
        font-size: 12px;
        margin-top: 18px;
        line-height: 1.7;
      }
      .wf-notice.error {
        color: #ac3447;
        background: #fff0f2;
      }
      .wf-layout-photo {
        width: 38px;
        height: 53px;
        object-fit: cover;
      }
      .wf-layout {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        background: white;
        border-radius: 10px;
        padding: 9px;
        justify-items: center;
        margin: 14px 0;
      }
      .wf-layout img {
        width: 100%;
        height: auto;
        aspect-ratio: 5/7;
        object-fit: cover;
      }
      .wf-layout.wide {
        grid-template-columns: repeat(4, 1fr);
        transform: none;
      }
      .wf-dim {
        position: absolute;
        inset: 0;
        background: #182c4d55;
        z-index: 3;
      }
      .wf-sheet {
        position: absolute;
        z-index: 4;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-radius: 24px 24px 0 0;
        max-height: 82%;
        height: 72%;
        display: flex;
        flex-direction: column;
      }
      .wf-sheet-head {
        padding: 20px 20px 12px;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .wf-sheet-head h3 {
        font-size: 17px;
        margin: 0;
      }
      .wf-sheet-head p {
        font-size: 11px;
        color: var(--muted);
        margin: 6px 0 0;
      }
      .wf-sheet-head button {
        border: 0;
        background: #f1f4f9;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        color: #6b7c92;
      }
      .wf-sheet-source {
        padding: 0 20px 12px;
        display: flex;
        gap: 9px;
        font-size: 12px;
        color: #56718e;
        flex-wrap: wrap;
      }
      .wf-sheet-source button {
        background: #f0f5ff;
        color: #315c9b;
        border: 0;
        border-radius: 8px;
        min-height: 44px;
        padding: 0 12px;
      }
      .wf-sheet-body {
        padding: 4px 20px 16px;
        overflow: auto;
        min-height: 0;
        flex: 1;
      }
      .wf-sheet-footer {
        padding: 12px 20px 26px;
        display: flex;
        flex-shrink: 0;
        background: white;
      }
      .wf-photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .wf-photo-grid img {
        width: 100%;
        aspect-ratio: 5/7;
        object-fit: cover;
        border-radius: 6px;
      }
      .wf-photo-grid img:first-child {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .wf-check-row {
        padding: 18px 0;
        font-size: 13px;
      }
      .wf-crop {
        width: 190px;
        aspect-ratio: 5/7;
        border: 2px solid white;
        outline: 12px solid #30425820;
        position: relative;
        margin: 20px auto;
      }
      .wf-crop img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .wf-crop::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            transparent 33%,
            #ffffff80 33%,
            #ffffff80 33.6%,
            transparent 33.6%,
            transparent 66%,
            #ffffff80 66%,
            #ffffff80 66.6%,
            transparent 66.6%
          ),
          linear-gradient(
            transparent 33%,
            #ffffff80 33%,
            #ffffff80 33.6%,
            transparent 33.6%,
            transparent 66%,
            #ffffff80 66%,
            #ffffff80 66.6%,
            transparent 66.6%
          );
      }
      .wf-slider {
        accent-color: var(--blue);
        width: 100%;
        margin: 16px 0;
      }
      .wf-comparison {
        position: relative;
        width: 180px;
        margin: auto;
      }
      .wf-comparison .wf-photo {
        height: 250px;
        width: 180px;
        object-fit: cover;
      }
      .wf-comparison::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: white;
      }
      .wf-compare-labels {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 10px auto 0;
        width: 180px;
        max-width: 100%;
      }
      .wf-compare-labels span {
        font-size: 12px;
        color: var(--muted);
      }
      .wf-section-title {
        font-size: 13px;
        font-weight: 600;
        margin: 18px 0 10px;
      }
      .wf-order-card {
        background: white;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .wf-order-card strong {
        font-size: 13px;
      }
      .wf-chip {
        color: var(--blue);
        background: #edf3ff;
        border-radius: 5px;
        padding: 4px 7px;
        font-size: 10px;
      }
      .wf-success {
        font-size: 36px;
        color: #28a479;
        margin: 30px 0 18px;
      }
      .wf-gallery-count {
        font-size: 11px;
        color: var(--muted);
        padding-bottom: 10px;
      }
      .wf-meta {
        font-size: 11px;
        color: #8b99ad;
        line-height: 1.8;
        margin-top: 10px;
      }
      @media (max-width: 1150px) {
        .doc-layout {
          grid-template-columns: 180px minmax(330px, 402px) minmax(240px, 1fr);
          gap: 16px;
          padding: 18px;
        }
        .doc-panel {
          padding: 18px;
        }
      }
      @media (max-width: 940px) {
        .doc-layout {
          grid-template-columns: minmax(300px, 402px) minmax(240px, 1fr);
          justify-content: center;
        }
        .doc-nav {
          display: none;
        }
        .doc-mobile-select {
          display: block;
          margin: 12px 0 0;
          width: 100%;
          max-width: 500px;
          min-height: 40px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: white;
        }
      }
      @media (max-width: 650px) {
        .doc-header {
          padding: 20px;
        }
        .doc-layout {
          display: flex;
          flex-direction: column;
          padding: 16px;
          gap: 20px;
        }
        .doc-stage {
          max-width: 402px;
          width: 100%;
          margin: auto;
        }
        .doc-panel {
          width: 100%;
        }
        .doc-header h1 {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <header class="doc-header">
      <div class="doc-eyebrow">知拍 1.4.6 / 产品文档 / 2026.10.19</div>
      <h1>常用工具 · 逐页职责与操作路径</h1>
      <p>
        结构示意，不是运行中的
        APP，也不代表视觉已验收。手机内按钮用于串联相关说明；“返回文档目录”代表退出当前工具。<br /><a
          href="common-tools-1.4.6.md"
          >完整产品需求</a
        >
        ·
        <a href="../reviews/common-tools-20261019/review.md"
          >问题清单与验证证据</a
        >
      </p>
      <select
        class="doc-mobile-select"
        id="page-select"
        aria-label="选择页面"
      ></select>
    </header>
    <main class="doc-layout">
      <nav class="doc-nav" id="nav" aria-label="页面说明目录"></nav>
      <section class="doc-stage">
        <div class="doc-pager">
          <button id="prev">前一说明</button><span id="count"></span
          ><button id="next">后一说明</button>
        </div>
        <div class="wireframe-wrap" id="phone" aria-label="页面结构示意"></div>
        <div class="doc-status" id="states" aria-label="示意状态"></div>
        <p id="doc-feedback" class="doc-callout" role="status"></p>
      </section>
      <article class="doc-panel" id="notes"></article>
    </main>
    <script>
      const pages = [
        {
          id: "p01",
          name: "工具选照片页",
          notes: [
            "顶部：52px导航高、左右12px留白，左侧44px白色圆底返回、20px深蓝箭头，工具名称17px居中；右侧不放订单与分享。冲印和六项工具各步骤与完成页均使用同一导航组件。操作阶段显示三步进度，完成页不再展示步骤条。",
            "未选图：小白熊、“选取一张照片”、“知拍相册 / 手机相册”；直接放在页面背景，不包白卡。",
            "已选图：照片居中，下方12px间距为12px灰色规格文字，再下方是16px图标＋13px蓝字“更换照片”，无底色，点击高度至少44px。照片完整适应5∶7预览区，余区浅灰，不拉伸、不自动裁切原图。",
            "底部：未选图为“选取照片”；从后续步骤返回后为“下一步”。后续步骤不另放换图入口。",
            "交互：打开选图抽屉；取消保留照片和设置；重新确认同一照片保留设置；确认新照片清除旧输出并重新执行该工具的检查。带照片从其他入口进入时可跳过重复选图，但不能绕过必要检查。",
          ],
        },
        {
          id: "p02",
          name: "选择照片抽屉",
          notes: [
            "固定头部：“选择照片”、右上关闭；其下说明选择范围。",
            "固定来源区：“手机相册”、“制作一张”、“知拍相册”、照片数量。只支持单选；不出现“进入相册编辑”。",
            "独立滚动区：三列照片及选中标记。加载为“正在读取照片…”；空列表为“知拍相册暂无照片”；读取失败为“相册暂时无法读取，可重试或从手机相册选图。”，提供“重新读取”。",
            "固定底部：“使用这张照片”；未选中有效照片时禁用。只有照片列表滚动，标题、来源和确认区不跟随滚动。",
            "手机相册取消不换图；“制作一张”进入个人制作，完成后将新成片带回当前工具。",
          ],
        },
        {
          id: "p03",

            已发货: "可查看运单，配送为原型演示",
          };
          document.querySelector(".wf-body h3").textContent = state;
          document.querySelector(".wf-body p").textContent =
            descriptions[state];
          document.querySelector(".wf-footer").innerHTML =
            '<div class="wf-actions">' +
            (state === "待付款"
              ? btn("取消订单", "p22", true) + btn("继续支付", "p20")
              : btn(
                  state === "付款确认中"
                    ? "查询结果（示意）"
                    : "查看运单（示意）",
                  "p23",
                )) +
            "</div>";
        }
        document.getElementById("notes").innerHTML =
          '<span class="doc-tag">' +
          p.id.toUpperCase() +
          " / 结构与流程说明</span><h2>" +
          escape(p.name) +
          "</h2><ol>" +
          p.notes.map((s) => "<li>" + escape(s) + "</li>").join("") +
          '</ol><div class="doc-callout">此结构图用于明确标题、内容、操作的职责与分区；不是视觉定稿。付款、检查等按钮仅跳转文档示意。以产品需求和实际原型为准。</div>';
        document.getElementById("states").innerHTML = (v.states || [])
          .map(
            (s) =>
              `<button class="${state === s ? "active" : ""}" data-state="${s}">${s}</button>`,
          )
          .join("");
        document.getElementById("count").textContent =
          current + 1 + " / " + pages.length;
        document.getElementById("prev").disabled = current === 0;
        document.getElementById("next").disabled = current === pages.length - 1;
        document.getElementById("page-select").value = p.id;
        document
          .querySelectorAll("#nav a")
          .forEach((a) =>
            a.setAttribute(
              "aria-current",
              a.hash === "#" + p.id ? "page" : "false",
            ),
          );
      }
      function go(id) {
        const next = pages.findIndex((p) => p.id === id);
        if (next < 0) return;
        current = next;
        state = view[id].states?.[0] || "";
        if (location.hash !== "#" + id) location.hash = id;
        render();
      }
      document.getElementById("nav").innerHTML = pages
        .map(
          (p) =>
            `<a href="#${p.id}"><strong>${p.id.toUpperCase()}</strong>${escape(p.name)}</a>`,
        )
        .join("");
      document.getElementById("page-select").innerHTML = pages
        .map(
          (p) =>
            `<option value="${p.id}">${p.id.toUpperCase()} ${escape(p.name)}</option>`,
        )
        .join("");
      document
        .getElementById("page-select")
        .addEventListener("change", (e) => go(e.target.value));
      document.getElementById("prev").onclick = () => go(pages[current - 1].id);
      document.getElementById("next").onclick = () => go(pages[current + 1].id);
      document.addEventListener("click", (e) => {
        const b = e.target.closest(
          "[data-go],[data-state],[data-doc-exit],[data-note]",
        );
        if (!b) return;
        if (b.dataset.note) {
          document.getElementById("doc-feedback").textContent = b.dataset.note;
          return;
        }
        if (b.hasAttribute("data-doc-exit")) {
          document.getElementById("page-select").focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (b.dataset.go) {
          go(b.dataset.go);
          if (b.dataset.targetState) {
            state = b.dataset.targetState;
            render();
          }
        } else if (b.dataset.state) {
          state = b.dataset.state;
          render();
        }
      });
      window.addEventListener("hashchange", () => {
        if (location.hash.slice(1) !== pages[current].id)
          go(location.hash.slice(1));
      });
      go(
        pages.some((p) => p.id === location.hash.slice(1))
          ? location.hash.slice(1)
          : "p01",
      );
    </script>
  </body>
</html>
