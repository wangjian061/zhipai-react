<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210"><g font-family="PingFang SC, Heiti SC, sans-serif"><rect x="0" y="0" width="1400" height="1210" rx="0" fill="#e9edf5" stroke="none"/><text x="36" y="43" font-size="24" fill="#203858" font-weight="650" text-anchor="start">服务｜九项帮助、任务定位与邮件恢复</text><text x="36" y="74" font-size="14" fill="#526782" font-weight="400" text-anchor="start">保留专区头部、通知入口和底部导航；客服靠前，九项帮助在同一正文区完整可达。</text><text x="36" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">① 服务中心</text><text x="36" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">九项帮助自然滚动，保持现有白卡和对齐</text><rect x="33" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(36 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="0" y="55" width="402" height="165" rx="0" fill="#eaf0fc" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle"></text><text x="24" y="159" font-size="25" fill="#203858" font-weight="650" text-anchor="start">服务中心</text><text x="24" y="186" font-size="13" fill="#526782" font-weight="400" text-anchor="start">采集帮助 · 客服支持</text><rect x="291" y="132" width="88" height="62" rx="12" fill="#e1e9f8" stroke="none"/><text x="335" y="158" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">沿用现有</text><text x="335" y="178" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">客服插画</text><rect x="0" y="204" width="402" height="48" rx="24" fill="#f3f5fc" stroke="none"/><rect x="16" y="230" width="370" height="58" rx="16" fill="#fff" stroke="none"/><g transform="translate(42 255)" fill="none" stroke="#526782" stroke-width="1.6"><path d="M-9 5h18l-2-4v-5a7 7 0 0 0-14 0v5Z"/><path d="M-3 9a3 3 0 0 0 6 0"/></g><text x="66" y="264" font-size="15" fill="#203858" font-weight="600" text-anchor="start">通知中心</text><path d="m361 251 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="16" y="302" width="370" height="83" rx="16" fill="#fff" stroke="none"/><text x="32" y="332" font-size="16" fill="#203858" font-weight="650" text-anchor="start">联系知拍客服</text><text x="32" y="360" font-size="12" fill="#526782" font-weight="400" text-anchor="start">采集问题统一受理，协助协调机构</text><path d="m361 332 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="16" y="399" width="370" height="373" rx="16" fill="#fff" stroke="none"/><text x="32" y="432" font-size="16" fill="#203858" font-weight="650" text-anchor="start">采集帮助</text><text x="32" y="471" font-size="13" fill="#203858" font-weight="400" text-anchor="start">如何找到需要参加的采集项目？</text><path d="m361 461 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="32" y="498" width="338" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="32" y="523" font-size="13" fill="#203858" font-weight="400" text-anchor="start">如何获取机构／院校二维码？</text><path d="m361 513 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="32" y="550" width="338" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="32" y="575" font-size="13" fill="#203858" font-weight="400" text-anchor="start">如何获取学信网图像采集码？</text><path d="m361 565 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="32" y="602" width="338" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="32" y="627" font-size="13" fill="#203858" font-weight="400" text-anchor="start">身份信息无法匹配或资料有误怎么办？</text><path d="m361 617 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="32" y="654" width="338" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="32" y="679" font-size="13" fill="#203858" font-weight="400" text-anchor="start">支付后没有继续采集，怎么办？</text><path d="m361 669 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="32" y="706" width="338" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="32" y="731" font-size="13" fill="#203858" font-weight="400" text-anchor="start">照片制作失败怎么办？</text><path d="m361 721 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="16" y="785" width="306" height="58" rx="29" fill="#fff" stroke="#edf1f6"/><text x="73" y="819" font-size="12" fill="#526782" font-weight="500" text-anchor="middle">专项列表</text><text x="172" y="819" font-size="12" fill="#526782" font-weight="500" text-anchor="middle">采集记录</text><text x="267" y="819" font-size="12" fill="#0032ff" font-weight="600" text-anchor="middle">服务中心</text><rect x="332" y="785" width="54" height="58" rx="27" fill="#fff" stroke="none"/><text x="359" y="819" font-size="12" fill="#526782" font-weight="500" text-anchor="middle">扫码</text></g><text x="491" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">② 帮助正文上滑抽屉</text><text x="491" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">长正文独立滚动，关闭后保留原位置</text><rect x="488" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(491 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="0" y="55" width="402" height="165" rx="0" fill="#eaf0fc" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle"></text><text x="24" y="159" font-size="25" fill="#203858" font-weight="650" text-anchor="start">服务中心</text><text x="24" y="186" font-size="13" fill="#526782" font-weight="400" text-anchor="start">采集帮助 · 客服支持</text><rect x="291" y="132" width="88" height="62" rx="12" fill="#e1e9f8" stroke="none"/><text x="335" y="158" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">沿用现有</text><text x="335" y="178" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">客服插画</text><rect x="0" y="204" width="402" height="48" rx="24" fill="#f3f5fc" stroke="none"/><rect x="16" y="250" width="370" height="480" rx="20" fill="#fff" stroke="none"/><rect x="0" y="0" width="402" height="874" rx="34" fill="#162b4b66" stroke="none"/><rect x="0" y="300" width="402" height="574" rx="24" fill="#fff" stroke="none"/><rect x="183" y="309" width="36" height="4" rx="2" fill="#d5deea" stroke="none"/><text x="20" y="351" font-size="18" fill="#203858" font-weight="650" text-anchor="start">采集帮助</text><path d="m362 339 10 10m-10 0 10-10" stroke="#526782" stroke-width="1.7"/><text x="20" y="382" font-size="12" fill="#526782" font-weight="400" text-anchor="start">身份信息无法匹配或资料有误怎么办？</text><text x="20" y="432" font-size="15" fill="#526782" font-weight="400" text-anchor="start">先核对所选项目、认证方式及输入资料。</text><text x="20" y="510" font-size="15" fill="#526782" font-weight="400" text-anchor="start">确认无误后仍无法匹配，或姓名、采集资格、名册信息</text><text x="20" y="537" font-size="15" fill="#526782" font-weight="400" text-anchor="start">有误时，请联系知拍客服，由客服协调机构核实。</text><text x="20" y="647" font-size="14" fill="#526782" font-weight="400" text-anchor="start">不要通过重复创建任务解决资料问题。</text><text x="20" y="711" font-size="14" fill="#0032ff" font-weight="500" text-anchor="start">仍需帮助？联系知拍客服</text><rect x="20" y="780" width="362" height="48" rx="14" fill="#0032ff" stroke="none"/><text x="201" y="810" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">返回服务中心</text></g><text x="946" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">③ 邮件联系与复制恢复</text><text x="946" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">有任务带项目及客服号；无任务也能咨询</text><rect x="943" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(946 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="0" y="55" width="402" height="165" rx="0" fill="#eaf0fc" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle"></text><text x="24" y="159" font-size="25" fill="#203858" font-weight="650" text-anchor="start">服务中心</text><text x="24" y="186" font-size="13" fill="#526782" font-weight="400" text-anchor="start">采集帮助 · 客服支持</text><rect x="291" y="132" width="88" height="62" rx="12" fill="#e1e9f8" stroke="none"/><text x="335" y="158" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">沿用现有</text><text x="335" y="178" font-size="11" fill="#526782" font-weight="400" text-anchor="middle">客服插画</text><rect x="0" y="204" width="402" height="48" rx="24" fill="#f3f5fc" stroke="none"/><rect x="16" y="250" width="370" height="480" rx="20" fill="#fff" stroke="none"/><rect x="0" y="0" width="402" height="874" rx="34" fill="#162b4b66" stroke="none"/><rect x="0" y="300" width="402" height="574" rx="24" fill="#fff" stroke="none"/><rect x="183" y="309" width="36" height="4" rx="2" fill="#d5deea" stroke="none"/><text x="20" y="351" font-size="18" fill="#203858" font-weight="650" text-anchor="start">联系知拍客服</text><path d="m362 339 10 10m-10 0 10-10" stroke="#526782" stroke-width="1.7"/><text x="20" y="382" font-size="12" fill="#526782" font-weight="400" text-anchor="start">由用户在手机邮件应用中编辑并发送</text><rect x="20" y="410" width="362" height="110" rx="14" fill="#f3f5fc" stroke="none"/><text x="36" y="438" font-size="13" fill="#526782" font-weight="400" text-anchor="start">本次采集</text><text x="36" y="468" font-size="12" fill="#526782" font-weight="400" text-anchor="start">项目</text><text x="364" y="468" font-size="13" fill="#203858" font-weight="400" text-anchor="end">示例学院毕业生图像采集</text><text x="36" y="496" font-size="12" fill="#526782" font-weight="400" text-anchor="start">客服号</text><text x="364" y="496" font-size="13" fill="#203858" font-weight="650" text-anchor="end">示例：202611030001</text><text x="20" y="558" font-size="13" fill="#526782" font-weight="400" text-anchor="start">客服邮箱</text><text x="20" y="591" font-size="18" fill="#203858" font-weight="600" text-anchor="start">zpai_service@163.com</text><text x="20" y="632" font-size="13" fill="#526782" font-weight="400" text-anchor="start">无法打开邮件应用时，可复制邮箱后自行联系。</text><text x="20" y="701" font-size="13" fill="#526782" font-weight="400" text-anchor="start">尚无采集任务，也可以说明项目和问题后咨询。</text><rect x="20" y="780" width="140" height="48" rx="14" fill="#eef2fa" stroke="none"/><text x="90" y="810" font-size="15" fill="#203858" font-weight="600" text-anchor="middle">复制邮箱</text><rect x="172" y="780" width="210" height="48" rx="14" fill="#0032ff" stroke="none"/><text x="277" y="810" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">打开邮箱</text></g><text x="36" y="1080" font-size="14" fill="#526782" font-weight="400" text-anchor="start">九项帮助包含：找项目、机构码、学信网码、身份匹配、支付、制作失败、审核未通过、上网失败、保存。</text><text x="36" y="1110" font-size="14" fill="#526782" font-weight="400" text-anchor="start">帮助与邮箱共用可替换配置；原型模拟读取失败／重试，不代表真实后台已接入。</text><text x="36" y="1140" font-size="14" fill="#526782" font-weight="400" text-anchor="start">登录沿用已确认A：手机号→验证码、密码次入口、第三方置底，保持单屏不滑动。</text><text x="36" y="1184" font-size="12" fill="#526782" font-weight="400" text-anchor="start">结构样图，非实际页面截图。姓名、项目、时间及消息为演示示例；沿用知拍现有设计规范。</text></g></svg>