" text-anchor="start">采集安排调整</text><text x="366" y="443" font-size="11" fill="#526782" font-weight="400" text-anchor="end">昨天</text><circle cx="66" cy="439" r="3" fill="#0032ff"/><text x="74" y="468" font-size="12" fill="#526782" font-weight="400" text-anchor="start">项目通知</text><text x="74" y="493" font-size="13" fill="#526782" font-weight="400" text-anchor="start">请阅读本项目最新采集安排。</text><path d="m365 499 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="16" y="545" width="370" height="118" rx="16" fill="#fff" stroke="none"/><rect x="32" y="563" width="30" height="30" rx="9" fill="#eef2fa" stroke="none"/><g transform="translate(47 576)" fill="none" stroke="#526782" stroke-width="1.6"><path d="M-9 5h18l-2-4v-5a7 7 0 0 0-14 0v5Z"/><path d="M-3 9a3 3 0 0 0 6 0"/></g><text x="74" y="574" font-size="15" fill="#203858" font-weight="600" text-anchor="start">审核未通过</text><text x="366" y="573" font-size="11" fill="#526782" font-weight="400" text-anchor="end">11月1日</text><text x="74" y="598" font-size="12" fill="#526782" font-weight="400" text-anchor="start">与上方完成消息为同一任务</text><text x="74" y="623" font-size="13" fill="#a13932" font-weight="400" text-anchor="start">保留当时消息，点击仍进入任务最新状态。</text><path d="m365 629 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/><rect x="16" y="675" width="370" height="118" rx="16" fill="#fff" stroke="none"/><rect x="32" y="693" width="30" height="30" rx="9" fill="#eef2fa" stroke="none"/><g transform="translate(47 706)" fill="none" stroke="#526782" stroke-width="1.6"><path d="M-9 5h18l-2-4v-5a7 7 0 0 0-14 0v5Z"/><path d="M-3 9a3 3 0 0 0 6 0"/></g><text x="74" y="704" font-size="15" fill="#203858" font-weight="600" text-anchor="start">平台服务说明</text><text x="366" y="703" font-size="11" fill="#526782" font-weight="400" text-anchor="end">10月31日</text><text x="74" y="728" font-size="12" fill="#526782" font-weight="400" text-anchor="start">系统通知</text><text x="74" y="753" font-size="13" fill="#526782" font-weight="400" text-anchor="start">点击阅读完整公告。</text><path d="m365 759 5 5-5 5" fill="none" stroke="#526782" stroke-width="1.6"/></g><text x="491" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">② 项目／系统公告正文</text><text x="491" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">采集通知直接进入任务；公告在此完整阅读</text><rect x="488" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(491 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle">通知详情</text><text x="24" y="153" font-size="12" fill="#526782" font-weight="400" text-anchor="start">项目通知</text><text x="24" y="188" font-size="20" fill="#203858" font-weight="650" text-anchor="start">采集安排调整</text><text x="24" y="216" font-size="12" fill="#526782" font-weight="400" text-anchor="start">示例学院 · 2026年11月3日 09:00</text><rect x="24" y="237" width="354" height="1" rx="0" fill="#edf1f6" stroke="none"/><text x="24" y="274" font-size="15" fill="#526782" font-weight="400" text-anchor="start">请参加本项目的同学核对采集安排，并在项目开放期</text><text x="24" y="301" font-size="15" fill="#526782" font-weight="400" text-anchor="start">间完成拍摄与提交。</text><text x="24" y="379" font-size="15" fill="#526782" font-weight="400" text-anchor="start">如需了解当前要求，请进入项目查看。已经提交审核</text><text x="24" y="406" font-size="15" fill="#526782" font-weight="400" text-anchor="start">的同学，可在采集记录中查看办理进度。</text><rect x="20" y="772" width="362" height="48" rx="14" fill="#0032ff" stroke="none"/><text x="201" y="802" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">查看项目</text></g><text x="946" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">③ 强制更新状态</text><text x="946" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">新版本可获取后拦截；无取消和跳过入口</text><rect x="943" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(946 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="0" y="55" width="402" height="165" rx="0" fill="#eaf0fc" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle"></text><text x="24" y="159" font-size="25" fill="#203858" font-weight="650" text-anchor="start">知拍</text><text x="24" y="186" font-size="13" fill="#526782" font-weight="400" text-anchor="start">专项采集 · 证件照制作</text><g transform="translate(337 169)" fill="none" stroke="#526782" stroke-width="1.6"><path d="M-9 5h18l-2-4v-5a7 7 0 0 0-14 0v5Z"/><path d="M-3 9a3 3 0 0 0 6 0"/></g><rect x="0" y="204" width="402" height="48" rx="24" fill="#f3f5fc" stroke="none"/><rect x="16" y="247" width="370" height="220" rx="20" fill="#fff" stroke="none"/><rect x="16" y="488" width="370" height="275" rx="20" fill="#fff" stroke="none"/><rect x="0" y="0" width="402" height="874" rx="34" fill="#162b4b66" stroke="none"/><rect x="36" y="248" width="330" height="375" rx="20" fill="#fff" stroke="none"/><g transform="translate(201 291)" fill="none" stroke="#526782" stroke-width="1.6"><path d="M-9 5h18l-2-4v-5a7 7 0 0 0-14 0v5Z"/><path d="M-3 9a3 3 0 0 0 6 0"/></g><text x="201" y="332" font-size="20" fill="#203858" font-weight="650" text-anchor="middle">发现新版本</text><text x="60" y="368" font-size="14" fill="#526782" font-weight="400" text-anchor="start">请更新至最新版本后继续使用知拍。</text><rect x="60" y="412" width="282" height="78" rx="12" fill="#f3f5fc" stroke="none"/><text x="76" y="437" font-size="12" fill="#526782" font-weight="400" text-anchor="start">更新内容</text><text x="76" y="462" font-size="13" fill="#203858" font-weight="400" text-anchor="start">以当前平台正式发布说明为准</text><rect x="60" y="519" width="282" height="48" rx="14" fill="#0032ff" stroke="none"/><text x="201" y="549" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">去更新</text><text x="201" y="594" font-size="12" fill="#526782" font-weight="400" text-anchor="middle">从更新渠道返回后重新检查版本</text></g><text x="36" y="1080" font-size="14" fill="#526782" font-weight="400" text-anchor="start">采集消息成功打开任务后标已读；旧消息始终进入最新任务状态，失败不误标已读。</text><text x="36" y="1110" font-size="14" fill="#526782" font-weight="400" text-anchor="start">更新失败保留任务并可重试；在原型中演示升级结果，不让原型日期版本触发App强更。</text><text x="36" y="1140" font-size="14" fill="#526782" font-weight="400" text-anchor="start">重要站内提醒避开拍摄、付款和提交；手机系统推送通过明确标注的原型演示呈现。</text><text x="36" y="1184" font-size="12" fill="#526782" font-weight="400" text-anchor="start">结构样图，非实际页面截图。姓名、项目、时间及消息为演示示例；沿用知拍现有设计规范。</text></g></svg>