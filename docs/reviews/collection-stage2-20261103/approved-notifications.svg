<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210"><g font-family="PingFang SC, Heiti SC, sans-serif"><rect x="0" y="0" width="1400" height="1210" rx="0" fill="#e9edf5" stroke="none"/><text x="36" y="43" font-size="24" fill="#203858" font-weight="650" text-anchor="start">通知｜消息记录、正文与强制更新</text><text x="36" y="74" font-size="14" fill="#526782" font-weight="400" text-anchor="start">列表沿用现有专区结构；补齐历史和已读，不增加清空、删除、一键已读。</text><text x="36" y="113" font-size="17" fill="#203858" font-weight="650" text-anchor="start">① 通知中心</text><text x="36" y="140" font-size="12" fill="#526782" font-weight="400" text-anchor="start">历史独立保留；未读点，已读仍可查看</text><rect x="33" y="159" width="408" height="880" rx="37" fill="#d5ddea" stroke="none"/><g transform="translate(36 162)"><rect x="0" y="0" width="402" height="874" rx="34" fill="#f3f5fc" stroke="none"/><text x="28" y="35" font-size="15" fill="#203858" font-weight="600" text-anchor="start">9:41</text><rect x="139" y="12" width="124" height="35" rx="20" fill="#101318" stroke="none"/><path d="M321 34v-5m5 5v-8m5 8V22m5 12V19" stroke="#203858" stroke-width="3"/><rect x="349" y="23" width="24" height="12" rx="3" fill="none" stroke="#203858"/><rect x="352" y="26" width="17" height="6" rx="1" fill="#203858" stroke="none"/><rect x="134" y="853" width="134" height="4" rx="2" fill="#203858" stroke="none"/><rect x="0" y="55" width="402" height="165" rx="0" fill="#eaf0fc" stroke="none"/><rect x="16" y="66" width="44" height="44" rx="22" fill="#fff" stroke="none"/><path d="m42 80-7 8 7 8" stroke="#203858" fill="none" stroke-width="1.7"/><text x="201" y="94" font-size="17" fill="#203858" font-weight="650" text-anchor="middle"></text><text x="24" y="159" font-size="25" fill="#203858" font-weight="650" text-anchor="start">通知中心</text><text x="24" y="186" font-size="13" fill="#526782" font-weight="400" text-anchor="start">项目动态 · 采集进度</text><g transform="translate(337 169)" fill="none" stroke="#526782" stroke-width="1.6"><pa